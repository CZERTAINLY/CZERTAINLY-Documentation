name: Documentation

on:
  pull_request:
    branches: [documentation]
  push:
    branches: [documentation]

jobs:
  checks:
    if: github.event_name != 'push'
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.x
      - name: Cache PlantUML server image
        id: puml-image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/plantuml/image.tar
          key: plantuml-server-sha256-5b9968b8723e03ef585396b257127337ca5f91e58ccbffc88f085bd649a717dc
      - name: Load or pull PlantUML server image
        run: |
          IMG='plantuml/plantuml-server@sha256:5b9968b8723e03ef585396b257127337ca5f91e58ccbffc88f085bd649a717dc'
          if [ -f ~/.cache/plantuml/image.tar ]; then
            docker load -i ~/.cache/plantuml/image.tar
          else
            docker pull "$IMG"
            mkdir -p ~/.cache/plantuml
            docker save "$IMG" -o ~/.cache/plantuml/image.tar
          fi
      - name: Test build
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: |
          yarn install --frozen-lockfile
          yarn build
  gh-release:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.x
      - name: Cache PlantUML server image
        id: puml-image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/plantuml/image.tar
          key: plantuml-server-sha256-5b9968b8723e03ef585396b257127337ca5f91e58ccbffc88f085bd649a717dc
      - name: Load or pull PlantUML server image
        run: |
          IMG='plantuml/plantuml-server@sha256:5b9968b8723e03ef585396b257127337ca5f91e58ccbffc88f085bd649a717dc'
          if [ -f ~/.cache/plantuml/image.tar ]; then
            docker load -i ~/.cache/plantuml/image.tar
          else
            docker pull "$IMG"
            mkdir -p ~/.cache/plantuml
            docker save "$IMG" -o ~/.cache/plantuml/image.tar
          fi
      - name: Build website
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
